name: Notify repo2 on production-for-repo2 update

on:
  push:
    branches: [production-for-repo2]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger repository_dispatch to repo2
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.REPO2_DISPATCH_PAT }}
          repository: hieu-cm-281/test-repo-2
          event-type: repo1-production-for-repo2-updated